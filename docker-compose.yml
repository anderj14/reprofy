services:
  reprofy-api:
    build: .
    command: uvicorn reprofy.api:app --host 0.0.0.0 --port 8001
    environment:
      REPROFY_PROJECT: /app/examples/shop
      REPROFY_INGEST_TOKEN: ${REPROFY_INGEST_TOKEN:?Set REPROFY_INGEST_TOKEN in .env.docker}
    volumes:
      - ./examples/shop:/app/examples/shop
    ports:
      - "127.0.0.1:8766:8001"

  demo-shop:
    build: .
    command: uvicorn demo_app:app --app-dir examples/shop --host 0.0.0.0 --port 8000
    environment:
      REPROFY_API_URL: http://reprofy-api:8001
      REPROFY_API_TOKEN: ${REPROFY_INGEST_TOKEN:?Set REPROFY_INGEST_TOKEN in .env.docker}
    depends_on:
      - reprofy-api
    ports:
      - "127.0.0.1:8000:8000"

  reprofy-worker:
    build: .
    command: python -m reprofy.worker --project ${PWD}/examples/shop
    env_file:
      - .env
    environment:
      REPROFY_TEST_PYTHON: /usr/local/bin/python
      REPROFY_MAX_AUTO_ATTEMPTS: ${REPROFY_MAX_AUTO_ATTEMPTS:-10}
      REPROFY_BASE_BRANCH: ${REPROFY_BASE_BRANCH:-}
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: ${PWD}
    volumes:
      - .:${PWD}
    depends_on:
      - reprofy-api
    restart: unless-stopped
