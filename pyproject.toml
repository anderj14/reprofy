[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reprofy"
version = "0.1.0"
description = "AI agent that turns plain-language bug reports into tested fixes."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "openai",
  "python-dotenv",
  "pydantic>=2,<3",
  "PyYAML>=6,<7",
]
[project.optional-dependencies]
dev = [
  "pytest",
]

[project.scripts]
reprofy = "reprofy.cli:main"
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "examples/shop/tests"]
python_files = ["test_*.py"]
pythonpath = ["src", "examples/shop"]
norecursedirs = ["fixtures", ".*", "__pycache__", "*.egg-info"]
