[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reprofy"
version = "0.1.0"
description = "AI agent that turns plain-language bug reports into tested fixes."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "openai",
  "python-dotenv",
]

[tool.setuptools.packages.find]
where = ["src"]
